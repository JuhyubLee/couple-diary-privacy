<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>커플 다이어리 – 법적 고지</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    h1 { font-size: 28px; color: #FF6B9D; margin-bottom: 8px; }
    p  { color: #777; margin-bottom: 40px; font-size: 15px; }
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.card {
      display: block;
      background: white;
      border-radius: 16px;
      padding: 32px 40px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
      text-align: center;
      min-width: 200px;
    }
    a.card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255,107,157,0.2);
    }
    .card .icon { font-size: 40px; margin-bottom: 12px; }
    .card .label { font-size: 15px; font-weight: 600; color: #FF6B9D; }
    footer { margin-top: 48px; font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <h1>💑 커플 다이어리</h1>
  <p>법적 고지 페이지</p>
  <div class="cards">
    <a class="card" href="privacy-policy.html">
      <div class="icon">🔒</div>
      <div class="label">개인정보 처리방침</div>
    </a>
    <a class="card" href="terms.html">
      <div class="icon">📄</div>
      <div class="label">서비스 이용약관</div>
    </a>
  </div>
  <footer>© 2026 커플 다이어리. All rights reserved.</footer>
</body>
</html>
